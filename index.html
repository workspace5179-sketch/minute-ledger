<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,"Microsoft YaHei",sans-serif;background:#f4f5ef;color:#23362c}nav{background:#183f33;color:white;padding:16px 5%;font:600 22px Georgia}main{max-width:1340px;margin:auto;padding:24px}h1{font-size:30px;letter-spacing:-1px}h2{font-size:17px;margin:0 0 12px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.card,fieldset{background:white;border:1px solid #d5ddd2;border-radius:10px;padding:16px;margin:0 0 12px}fieldset{min-width:0}legend{font-weight:bold}label{display:block;color:#53675b;font-size:13px;margin:6px 0}input:not([type=checkbox]),select,textarea{width:100%;padding:7px;border:1px solid #bfcfc2;border-radius:5px;background:#fff;font:inherit}input[type=checkbox]{accent-color:#256347}.pair,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.assets{display:flex;gap:5px;flex-wrap:wrap}.metrics{grid-template-columns:repeat(4,1fr)}.metrics b{display:block;font:600 21px consolas,monospace;color:#245942;margin-top:6px}.metrics div{border-bottom:1px solid #dae3dc;padding:8px}button{border:0;background:#22573f;color:white;font:inherit;border-radius:6px;padding:9px 14px;cursor:pointer}button:disabled{opacity:.5}form>button{width:100%}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.chart{width:100%;height:150px}.scroll{overflow:auto}table{border-collapse:collapse;white-space:nowrap;width:100%;font:13px consolas,monospace}th,td{text-align:right;border-bottom:1px solid #e0e6df;padding:8px}p{line-height:1.6}#msg{white-space:pre-wrap;overflow-wrap:anywhere;color:#934627}[hidden]{display:none!important}@media(max-width:720px){main{padding:14px}.layout{display:block}.metrics{grid-template-columns:1fr 1fr}}body{background-color:#07111c;background-image:linear-gradient(#1d425028 1px,transparent 1px),linear-gradient(90deg,#1d425028 1px,transparent 1px);background-size:32px 32px;color:#e5f2f6}

<nav><span>∿</span> MINUTE LEDGER</nav><main><h1>短周期策略回测</h1><div class="layout"><form id="form"><fieldset><legend>市场与数据</legend><label>数据来源<select id="source"><option value="example">内置验算样本</option><option value="sim">标的价格仿真</option><option value="csv">导入 CSV</option><option value="official">Polymarket 官方历史</option></select></label><label id="upload" hidden>CSV 文件<input id="file" type="file" accept=".csv"></label><label id="marketInput" hidden>已结算市场 slug（空格分隔）<textarea id="slugs"></textarea></label><div class="assets" id="assets"></div><div class="pair"><label>周期<select id="mins"><option>5</option><option>15</option></select></label><label>买入方向<select id="side"><option value="touch" selected>先触价的一方</option><option>Yes</option><option>No</option></select></label></div></fieldset><fieldset><legend>进场与注码</legend><div class="pair" id="entry"></div><div id="trigger"></div><p id="touchNote">从开盘起，先观察到报价大于 0 且不高于触发价的一方入场，每期最多一单。同分钟双触跳过。</p><label>仓位模式<select id="size"><option value="fixed">固定金额</option><option value="risk">权益百分比</option><option value="kelly">半 Kelly</option></select></label><div class="pair" id="money"></div><p id="sizeNote"></p><label>加码规则<select id="cycle"><option value="flat">固定倍率</option><option value="loss">亏损后加码</option><option value="win">盈利后加码</option></select></label><div class="pair" id="stake"></div></fieldset><fieldset><legend>出场与风控</legend><label><input type="checkbox" id="early" checked> 启用中途止盈止损</label><div class="pair" id="limits"></div></fieldset><button id="go">运行回测</button></form><article><div id="msg" role="status"></div><section class="card"><h2 id="title">回测结果</h2><div id="metrics" class="metrics"></div></section><section class="card"><h2>账户权益 · USD</h2><div id="equity"></div></section><section class="card"><h2>水下回撤 · %</h2><div id="dd"></div></section><section class="card"><div class="row"><h2>逐笔交易</h2><button id="save">导出 CSV</button></div><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="row"><button id="prev">上一页</button><p id="page"></p><button id="next">下一页</button></div></section></article></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), n=id=>Number($(id).value);
const all=['BTC','ETH','BNB','SOL'];
$('assets').innerHTML=all.map(a=>'<label><input type="checkbox" value="'+a+'" '+(a==='BTC'?'checked':'')+'>'+a+'</label>').join('');
function fields(id,list){$(id).innerHTML=list.map(([key,label,value,min,max])=>'<label>'+label+'<input required type="number" step="any" id="'+key+'" value="'+value+'" min="'+min+'" max="'+max+'"></label>').join('')}
fields('trigger',[['triggerPrice','首触买入价',.30,.001,.999]]);
fields('entry',[['low','最低合约价',.4,.001,.999],['high','最高合约价',.6,.001,.999]]);
fields('money',[['capital','初始资金 $',10000,1,1e10],['fixed','固定注码 $',100,.01,1e10],['risk','权益占比 %',2,.01,100],['prob','预估到期胜率（0–1）',.55,0,1]]);
fields('stake',[['step','加码幅度 %',20,0,100],['protect','连败重置轮数',3,1,50]]);
fields('limits',[['tp','止盈价',.8,0,1],['sl','止损价',.2,0,1],['breaker','日内熔断 %',10,.01,100],['fee','成交费 bp',0,0,1000]]);
const fail=s=>{throw Error(s)}, utc=t=>new Date(t*1000).toISOString().slice(0,19).replace('T',' '),fmt=v=>v==null?'—':typeof v==='string'?v:v.toLocaleString('en-US',{maximumFractionDigits:2});
function csvRows(text){let rows=[],row=[],s='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){s+='"';i++}else q=!q}else if(!q&&ch===','){row.push(s);s=''}else if(!q&&ch==='\n'){row.push(s.trim());if(row.some(Boolean))rows.push(row);row=[];s=''}else s+=ch}if(q)fail('CSV 引号不配对');row.push(s.trim());if(row.some(Boolean))rows.push(row);return rows}
const sample="timestamp,asset,minutes,open,settle,yes_prices,no_prices,spot_prices\n2025-01-01T00:00:00Z,BTC,5,95000,95100,\"[0.50,0.62,0.82,0.76,0.85]\",\"[0.51,0.39,0.19,0.25,0.16]\",\"[95000,95010,95070,95040,95080]\"\n2025-01-01T00:05:00Z,BTC,5,95100,95000,\"[0.50,0.42,0.19,0.25,0.10]\",\"[0.51,0.59,0.82,0.76,0.91]\",\"[95100,95090,95040,95050,95010]\"\n2025-01-01T00:10:00Z,BTC,5,95000,95020,\"[0.50,0.52,0.44,0.61,0.58]\",\"[0.51,0.49,0.57,0.40,0.43]\",\"[95000,95001,94998,95010,95009]\"\n";
function loadCSV(text,c){const [keys,...rows]=csvRows(text.replace(/^\uFEFF/,''));if(!keys||!['timestamp','asset','minutes','open','settle','yes_prices'].every(k=>keys.includes(k)))fail('CSV 须包含 timestamp, asset, minutes, open, settle, yes_prices');let out=[],seen=new Set();
for(const cells of rows){const r=Object.fromEntries(keys.map((k,i)=>[k,cells[i]])),a=r.asset;if(!c.assets.includes(a)||Number(r.minutes)!==c.m)continue;
const t=/^\d+$/.test(r.timestamp)?Number(r.timestamp):Date.parse(r.timestamp)/1000;if(!Number.isInteger(t)||t<946684800||t>4102444800||t%(c.m*60)||seen.has(a+t))fail('周期时间无效或重复');seen.add(a+t);
let p=JSON.parse(c.no&&r.no_prices?r.no_prices:r.yes_prices);if(!Array.isArray(p)||p.length!==c.m||p.some(v=>!Number.isFinite(v)||v<0||v>1))fail('分钟合约价序列无效');if(c.no&&!r.no_prices)p=p.map(x=>1-x);
const op=Number(r.open),cl=Number(r.settle);if(![op,cl].every(x=>Number.isFinite(x)&&x>0))fail('标的开盘或结算价无效');
out.push({a,t,p,pay:Number((cl>=op)!==c.no)})}return out}
function simulate(c){let out=[];for(const a of c.assets){let state=42+all.indexOf(a);const rand=()=>((state=(Math.imul(1664525,state)+1013904223)>>>0)+1)/4294967297;
let spot=100;for(let i=0;i<3*1440;i+=c.m){const op=spot,s=[],p=[];for(let j=0;j<c.m;j++){s.push(spot);const z=Math.log(spot/op)/(.0015*Math.sqrt(c.m-j));let prob=1/(1+Math.exp(-1.7*z));p.push(Math.max(.005,Math.min(.995,c.no?1-prob:prob)));spot*=Math.exp(.0015*Math.sqrt(-2*Math.log(rand()))*Math.cos(2*Math.PI*rand()))}out.push({a,t:1735689600+i*60,p,spot:s,pay:Number((spot>=op)!==c.no)})}}return out}
async function get(url){const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!r.ok)fail('HTTP '+r.status);return r.json()}
async function official(c){const ids=[...new Set($('slugs').value.trim().split(/\s+/))];if(ids.length>100)fail('每次最多 100 个市场');let out=[],warnings=[];for(const id of ids){let match=/^(btc|eth|bnb|sol)-updown-(5|15)m-(\d{10})$/.exec(id);if(!match)fail('请输入完整的市场 slug');const a=match[1].toUpperCase(),t=+match[3];if(+match[2]!==c.m||!c.assets.includes(a))continue;try{const meta=await get('https://gamma-api.polymarket.com/markets/slug/'+id),market=await get('https://clob.polymarket.com/markets/'+meta.conditionId);if(!market.closed||market.tokens.filter(x=>x.winner===true).length!==1)fail('尚无二元结算结果');let token=market.tokens.find(x=>(c.no?['no','down']:['yes','up']).includes(x.outcome.toLowerCase()));const history=await get('https://clob.polymarket.com/prices-history?'+new URLSearchParams({market:token.token_id,startTs:t,endTs:t+c.m*60,fidelity:1}));let bars=new Map();for(const b of history.history.sort((x,y)=>x.t-y.t)){const j=Math.floor((b.t-t)/60);if(j>=0&&j<c.m&&!bars.has(j)&&Number.isFinite(+b.p)&&+b.p>=0&&+b.p<=1)bars.set(j,b)}if(bars.size!==c.m)fail('分钟数据不完整');out.push({a,t,p:[...bars.values()].map(b=>+b.p),times:[...bars.values()].map(b=>+b.t),pay:+token.winner})}catch(e){warnings.push(id+' · '+e.message)}}if(warnings.length)$('msg').textContent='跳过 '+warnings.length+' 个市场：'+warnings.slice(0,4).join('；');if(!out.length)fail('没有可回放的官方数据。'+warnings.slice(0,2).join('；')+'。浏览器访问官方接口需要网络及跨域许可。');return out}
function firstTouch(yesMarkets,noMarkets,limit){
 const down=new Map(noMarkets.map(m=>[m.a+':'+m.t,m])), chosen=[];
 let ties=0, missing=0;
 for(const up of yesMarkets){
   const no=down.get(up.a+':'+up.t);
   if(!no){missing++;continue}
   for(let j=0;j<up.p.length;j++){
     const y=up.p[j]>0&&up.p[j]<=limit, n=no.p[j]>0&&no.p[j]<=limit;
     if(y&&n){ties++;break}
     if(!y&&!n)continue;
     const m=n?no:up;
     chosen.push({...m,no:n,p:m.p.slice(j),times:m.p.map((_,k)=>m.times?.[k]??m.t+k*60).slice(j)});
     break;
   }
 }
 return {chosen,ties,missing}
}
function replay(ms,c,range){let ev=new Map(),past=new Map();const add=(t,m,p,kind)=>{if(!ev.has(t))ev.set(t,[]);ev.get(t).push({m,p,kind})};
if(range){ev.set(range[0],[]);ev.set(range[1],[])}
ms.sort((a,b)=>a.t-b.t||a.a.localeCompare(b.a));for(const m of ms){m.p.forEach((p,j)=>add(m.times?.[j]??m.t+j*60,m,p,j?'mark':'open'));add(m.t+c.m*60,m,m.pay,'end')}
let cash=c.cap,peak=cash,dayPeak=cash,last=cash,day,halt=false,win=0,loss=0,bw=0,bl=0,mdd=0,gw=0,gl=0,wins=0,pos=new Map(),logs=[],curve=[],closes=new Map();const eq=()=>cash+[...pos.values()].reduce((s,x)=>s+x.qty*x.mark,0);const check=()=>{const v=eq();dayPeak=Math.max(dayPeak,v);if(dayPeak>0&&100*(1-v/dayPeak)+1e-10>=c.breaker)halt=true};
for(const [t,items] of [...ev].sort((a,b)=>a[0]-b[0])){const d=Math.floor(t/86400);if(day!==d){day=d;dayPeak=last;halt=false}items.sort((a,b)=>a.m.a.localeCompare(b.m.a));for(const e of items)if(pos.has(e.m))pos.get(e.m).mark=e.p;
for(const {m,p,kind} of items){const x=pos.get(m);if(!x||kind==='open')continue;const why=kind==='end'?'到期':c.early&&p>=c.tp?'TP':c.early&&p<=c.sl?'SL':'';if(!why)continue;pos.delete(m);const proceeds=p*x.qty*(kind==='end'?1:1-c.fee),pnl=proceeds-x.stake;cash+=proceeds;win=pnl>1e-9?win+1:0;loss=pnl< -1e-9?loss+1:0;bw=Math.max(bw,win);bl=Math.max(bl,loss);if(win){wins++;gw+=pnl}if(loss)gl-=pnl;logs.push([utc(x.t),utc(t),m.a,(m.no??c.no)?'No':'Yes',x.entry,p,x.stake,pnl,cash,eq(),why])}check();
for(const {m,p,kind} of items){if(kind!=='open'||halt||(!c.touch&&(p<c.low||p>c.high)))continue;const v=eq(),cost=p*(1+c.fee),base=c.size==='fixed'?c.fixed:c.size==='risk'?v*c.risk/100:cost<1?v*.5*Math.max(0,(c.prob-cost)/(1-cost)):0;let streak=c.cycle==='win'?win:c.cycle==='loss'&&loss<c.protect?loss:0;const stake=Math.min(cash,base*Math.pow(1+c.step/100,Math.min(100,streak)));if(stake>=.01){cash-=stake;pos.set(m,{t,mark:p,entry:p,qty:stake/cost,stake});check()}}last=eq();peak=Math.max(peak,last);const dd=100*(last/peak-1);mdd=Math.max(mdd,-dd);curve.push([t,last,dd]);closes.set(d,last)}
const end=curve.at(-1)[0];if(end%86400===0&&closes.size>1){closes.set(end/86400-1,last);closes.delete(end/86400)}let rets=[],prev=c.cap;const days=[...closes.keys()];for(let i=days[0];i<=days.at(-1);i++){let v=closes.get(i)??prev;if(prev>0)rets.push(v/prev-1);prev=v}const mean=rets.reduce((a,b)=>a+b,0)/rets.length,std=Math.sqrt(rets.reduce((s,v)=>s+(v-mean)**2,0)/(rets.length-1));return {logs,curve,metrics:[['总盈亏 $',last-c.cap],['回报率 %',100*(last/c.cap-1)],['胜率 %',logs.length?100*wins/logs.length:null],['盈亏因子',gl?gw/gl:gw?'∞':null],['日频夏普',std>1e-12?mean/std*Math.sqrt(365):null],['最大回撤 %',mdd],['最长连胜',bw],['最长连败',bl]]}}
function chart(id,curve,k,color){const vals=curve.map(x=>x[k]);let lo=vals.reduce((a,b)=>Math.min(a,b)),hi=vals.reduce((a,b)=>Math.max(a,b));if(k===2)hi=0;if(hi===lo){lo-=1;hi+=k===1?1:0}const [start,end]=[curve[0][0],curve.at(-1)[0]],x=t=>65+700*(t-start)/(end-start||1),y=v=>117-102*(v-lo)/(hi-lo),path=curve.map(v=>x(v[0]).toFixed(1)+','+y(v[k]).toFixed(1)).join(' ');$(id).innerHTML='<svg class="chart" viewBox="0 0 780 145" role="img" aria-label="'+(k===1?'账户权益':'水下回撤')+'">'+[lo,(lo+hi)/2,hi].map(v=>'<line x1="64" x2="765" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#243b4b"/><text x="58" y="'+(y(v)+4)+'" text-anchor="end" fill="#94a7b8" font-size="11">'+fmt(v)+'</text>').join('')+'<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+path+'"/><text x="65" y="140" font-size="11">'+utc(start)+' UTC</text><text x="765" y="140" text-anchor="end" font-size="11">'+utc(end)+' UTC</text></svg>'}
const names=['进场 UTC','出场 UTC','资产','方向','进场价','出场价','注码 $','盈亏 $','现金 $','权益 $','出场原因'];$('head').innerHTML='<tr>'+names.map(n=>'<th>'+n+'</th>').join('')+'</tr>';let records=[],page=0;
function table(){const pages=Math.max(1,Math.ceil(records.length/20));$('rows').innerHTML=records.slice(page*20,page*20+20).map(row=>'<tr>'+row.map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>').join('');$('page').textContent=records.length+' 笔 · '+(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page+1>=pages}
$('prev').onclick=()=>{page--;table()};$('next').onclick=()=>{page++;table()};$('save').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+[names,...records].map(r=>r.join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='minute-ledger.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('source').onchange=()=>{$('upload').hidden=$('source').value!=='csv';$('marketInput').hidden=$('source').value!=='official'};
async function run(e){e?.preventDefault();$('msg').textContent='';$('go').disabled=true;try{const c={assets:[...$('assets').querySelectorAll(':checked')].map(x=>x.value),m:n('mins'),no:$('side').value==='No',touch:$('side').value==='touch',limit:n('triggerPrice'),cap:n('capital'),size:$('size').value,cycle:$('cycle').value,early:$('early').checked,fee:n('fee')/10000};for(const k of ['low','high','tp','sl','protect','breaker','fixed','risk','step','prob'])c[k]=n(k);if(!c.assets.length||!Number.isInteger(c.protect)||(!c.touch&&c.low>c.high)||c.early&&!(c.touch?(c.sl<c.limit&&c.tp>c.limit):(c.sl<c.low&&c.tp>c.high)))fail('请检查资产、价格区间、止盈止损与连败轮数。');const source=$('source').value,srcLabel=$('source').selectedOptions[0].text;let raw=sample;if(source==='csv'){if(!$('file').files[0])fail('请选择 CSV 文件');raw=await $('file').files[0].text()}
const load=cfg=>source==='official'?official(cfg):source==='sim'?simulate(cfg):loadCSV(raw,cfg);
let ms=await load(c);if(!ms.length)fail('没有符合资产和周期的市场。内置样本为 BTC 5 分钟。');
const range=[ms.reduce((v,m)=>Math.min(v,m.t),Infinity),ms.reduce((v,m)=>Math.max(v,m.t+c.m*60),0)];
if(c.touch){const warnings=$('msg').textContent;const no=await load({...c,no:true});const scan=firstTouch(ms,no,c.limit);const count=ms.length;ms=scan.chosen;$('msg').textContent=[warnings,$('msg').textContent,...['检查 '+count+' 期 · 单边首触 '+ms.length+' 期 · 同分钟双触 '+scan.ties+' 期 · 缺另一边报价 '+scan.missing+' 期']].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' / ')}
const r=replay(ms,c,range);$('title').textContent=srcLabel+' · '+c.assets.join('/')+' · '+c.m+' 分钟';$('metrics').innerHTML=r.metrics.map(([k,v])=>'<div>'+k+'<b>'+fmt(v)+'</b></div>').join('');chart('equity',r.curve,1,'#47f3d0');chart('dd',r.curve,2,'#ff79b6');records=r.logs;page=0;table()}catch(err){$('msg').textContent='本次回测未完成：'+err.message}finally{$('go').disabled=false}}
function controls(){
 const touch=$('side').value==='touch',mode=$('size').value;
 for(const [id,visible] of [['entry',!touch],['trigger',touch],['touchNote',touch]]){
   $(id).hidden=!visible;$(id).querySelectorAll('input').forEach(x=>x.disabled=!visible)
 }
 for(const [id,show] of [['fixed',mode==='fixed'],['risk',mode==='risk'],['prob',mode==='kelly']]){
